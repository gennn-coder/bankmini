name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Hosting
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Sync Laravel Core to cPanel (laravel_core)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./laravel_core/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/flutter_nasabah/**
            .env*
            public/**
            README.md
            *.sql
            *.zip

      - name: 🌐 Sync Public Assets to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/
          server-dir: ./public_html/
          exclude: |
            index.php

      - name: 🔄 Clear Remote View & Route Cache
        run: |
          sleep 2
          curl -s -k "https://skansabaewallet.web.id/maintenance-cleanup-data-users-skansaba" || true
          curl -s -k "https://skansabaewallet.web.id/clear-system-cache-deploy-trigger" > /dev/null || true
          curl -s -k "https://skansabaewallet.web.id/unduh-aplikasi" > /dev/null || true
          curl -s -k "https://skansabaewallet.web.id/login?fresh=1" > /dev/null || true

